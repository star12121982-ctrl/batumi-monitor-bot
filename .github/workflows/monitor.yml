name: batumi-monitor

# Работа длинными «сменами». GitHub запускает workflow по расписанию, но при
# занятом runner-е новый запуск не отменяет текущий, а ВСТАЁТ В ОЧЕРЕДЬ
# (cancel-in-progress: false). Когда текущая смена завершается, из очереди
# сразу стартует следующая — так мониторинг идёт почти непрерывно, 24/7.
# Пропущенные за паузу сообщения скрипт добирает из истории Telegram,
# поэтому уведомления не теряются.
#
# ВАЖНО: сессия Telegram должна использоваться только в одном месте. Нельзя
# одновременно запускать локальный run.bat — Telegram заблокирует сессию.

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

concurrency:
  group: batumi-monitor
  # false = не отменять работающую смену, а ставить новый запуск в очередь.
  # Это защищает сессию Telegram от одновременного использования с двух IP.
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  monitor:
    runs-on: ubuntu-latest
    # 6 часов — жёсткий максимум GitHub. Ставим чуть меньше;
    # сама смена завершается раньше (TG_SHIFT минут) и уступает очередь.
    timeout-minutes: 350
    steps:
      - name: Получить код
        uses: actions/checkout@v4

      - name: Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Установить зависимости
        run: pip install -r requirements.txt

      - name: Восстановить сессию Telegram
        env:
          SESSION_KEY: ${{ secrets.SESSION_KEY }}
        run: python restore_session.py

      - name: Мониторинг
        env:
          MONITOR_MODE: cloud
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TG_API_ID: ${{ secrets.TG_API_ID }}
          TG_API_HASH: ${{ secrets.TG_API_HASH }}
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
          TG_FOLDER: ${{ secrets.TG_FOLDER }}
          TG_ROOT: ${{ secrets.TG_ROOT }}
          TG_TRIGGERS: ${{ secrets.TG_TRIGGERS }}
          TG_ALONE: ${{ secrets.TG_ALONE }}
          TG_FALLBACK: ${{ secrets.TG_FALLBACK }}
          TG_HEARTBEAT: ${{ secrets.TG_HEARTBEAT }}
          TG_SHIFT: ${{ secrets.TG_SHIFT }}
          TG_OUTGOING: ${{ secrets.TG_OUTGOING }}
        run: python monitor.py
