name: batumi-monitor

# Работа «сменами»: GitHub каждые 5 минут запускает новую смену,
# а предыдущую автоматически останавливает (cancel-in-progress).
# Пропущенные за паузу сообщения скрипт добирает из истории Telegram,
# поэтому уведомления не теряются.

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

concurrency:
  group: batumi-monitor
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Получить код
        uses: actions/checkout@v4

      - name: Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Установить зависимости
        run: pip install -r requirements.txt

      - name: Восстановить сессию Telegram
        env:
          SESSION_KEY: ${{ secrets.SESSION_KEY }}
        run: python restore_session.py

      - name: Мониторинг
        env:
          MONITOR_MODE: cloud
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TG_API_ID: ${{ secrets.TG_API_ID }}
          TG_API_HASH: ${{ secrets.TG_API_HASH }}
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
          TG_FOLDER: ${{ secrets.TG_FOLDER }}
          TG_ROOT: ${{ secrets.TG_ROOT }}
          TG_TRIGGERS: ${{ secrets.TG_TRIGGERS }}
          TG_ALONE: ${{ secrets.TG_ALONE }}
          TG_FALLBACK: ${{ secrets.TG_FALLBACK }}
          TG_HEARTBEAT: ${{ secrets.TG_HEARTBEAT }}
        run: python monitor.py
